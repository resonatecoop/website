{{ define "main" }}

{{ with .Params.announcement }}
<header id="announcement">

    <article class="measure-wide mb4">
      <p class="f5 tracked-tight">
        {{ .p1 | markdownify }}

      <a class="btn btn-black" href="{{ .link.href }}">{{ .link.text }}</a>

  </div>
</header>
{{ end }}

{{ end }}
